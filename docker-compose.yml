services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mindbalance
      POSTGRES_USER: mindbalance
      POSTGRES_PASSWORD: mindbalance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbalance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL so it always points to the db container,
      # even if backend/.env has a localhost URL
      DATABASE_URL: postgresql://mindbalance:mindbalance@db:5432/mindbalance
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
