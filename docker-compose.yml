version: '3.9'

services:
  db:
    image: postgres:16
    container_name: mindbalance_db
    restart: always
    environment:
      POSTGRES_USER: mindbalance
      POSTGRES_PASSWORD: mindbalance_secret
      POSTGRES_DB: mindbalance_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mindbalance_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://mindbalance:mindbalance_secret@db:5432/mindbalance_db
      SECRET_KEY: change_this_secret_key_in_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - '8000:8000'
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: mindbalance_frontend
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
